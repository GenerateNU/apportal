          format: uri
          readOnly: true
          type: string
        note:
          type: string
      type: object
    UpsertWrittenReviewInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpsertWrittenReviewInputBody.json
          format: uri
          readOnly: true
          type: string
        answers:
          items:
            $ref: "#/components/schemas/ReviewAnswerSubmission"
          type:
            - array
            - "null"
        submit:
          description: When true, marks the review as submitted
          type: boolean
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/User.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        full_name:
          type: string
        github_username:
          type: string
        graduation_year:
          format: int64
          type: integer
        major:
          type: string
        nuid:
          type: string
        roles:
          items:
            enum:
              - applicant
              - member
              - lead
              - chief
              - admin
            type: string
          type:
            - array
            - "null"
        updated_at:
          format: date-time
          type: string
      required:
        - nuid
        - email
        - full_name
        - roles
        - created_at
        - updated_at
      type: object
    UsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        has_more:
          description: True if more results exist beyond this page
          type: boolean
        users:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - users
        - has_more
      type: object
    WrittenAnswer:
      additionalProperties: false
      properties:
        answer_file_name:
          type: string
        answer_file_path:
          type: string
        answer_options: {}
        answer_text:
          type: string
        application_id:
          type: string
        id:
          type: string
        question_id:
          type: string
        submitted_at:
          format: date-time
          type: string
      required:
        - id
        - application_id
        - question_id
        - submitted_at
      type: object
    WrittenReviewAnswer:
      additionalProperties: false
      properties:
        answer_options: {}
        answer_text:
          type: string
        id:
          type: string
        review_id:
          type: string
        review_question_id:
          type: string
        score:
          format: int64
          type: integer
        submitted_at:
          format: date-time
          type: string
      required:
        - id
        - review_id
        - review_question_id
        - submitted_at
      type: object
    WrittenReviewDetail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WrittenReviewDetail.json
          format: uri
          readOnly: true
          type: string
        answers:
          items:
            $ref: "#/components/schemas/WrittenReviewAnswer"
          type:
            - array
            - "null"
        application_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        reviewer_name:
          type: string
        reviewer_nuid:
          type: string
        submitted_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - answers
        - id
        - application_id
        - reviewer_nuid
        - created_at
        - updated_at
      type: object
info:
  description: Generate application portal — applications, reviews, and the hiring pipeline.
  title: apportal API
  version: 0.1.0
openapi: 3.1.0
paths:
  /answers:
    get:
      description: One request for a page of applications, instead of one per application. Reviewer-only; draft answers are never included.
      operationId: list-answers-bulk
      parameters:
        - description: Comma-separated application IDs
          explode: false
          in: query
          name: application_ids
          schema:
            description: Comma-separated application IDs
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WrittenAnswer"
                type:
                  - array
                  - "null"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List written answers for several applications
      tags:
        - Answers
  /applicants:
    post:
      description: Applicant-facing; upserts by NUID.
      operationId: upsert-applicant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertApplicantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
          description: OK
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create or update an applicant
      tags:
        - Applicants
  /applicants/{nuid}:
    get:
      operationId: get-applicant
      parameters:
        - in: path
          name: nuid
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get an applicant
      tags:
        - Applicants
  /applicants/{nuid}/challenge-score:
    get:
      description: Reviewer only. Reads the applicant's best finished expedition from the separate challenge server, matched by their apportal email. Body is null if they have none there (e.g. they took the frontend challenge, or the lookup isn't configured).
      operationId: get-challenge-score
      parameters:
        - in: path
          name: nuid
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeScore"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get an applicant's technical challenge score
      tags:
        - Applicants
  /application-templates/open:
    get:
      description: A row is included only when both its own status and its owning cycle's status are "open".
      operationId: list-open-application-templates
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ApplicationTemplate"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List application templates currently open to applicants
      tags:
        - Application Templates
  /applications:
    get:
      description: Reviewer queue; filter by cycle_id, role, stage, answer_filters, and rating_filters. Applicants may list their own by passing user_nuid.
      operationId: list-applications
      parameters:
        - explode: false
          in: query
          name: cycle_id
          schema:
            type: string
        - explode: false
          in: query
          name: user_nuid
          schema:
            type: string
        - description: Limit to applications this lead is assigned to review
          explode: false
          in: query
          name: assigned_to
          schema:
            description: Limit to applications this lead is assigned to review
            type: string
        - description: Limit to applications this reviewer is assigned to interview
          explode: false
          in: query
          name: interviewer_nuid
          schema:
            description: Limit to applications this reviewer is assigned to interview
            type: string
        - description: Limit to applications this lead is assigned to review the interview recording of
          explode: false
          in: query
          name: recording_reviewer_nuid
          schema:
            description: Limit to applications this lead is assigned to review the interview recording of
            type: string
        - explode: false
          in: query
          name: role
          schema:
            type: string
        - explode: false
          in: query
          name: stage
          schema:
            type: string
        - description: Comma-separated list of stages, e.g. "accepted,rejected"; an application matches any of them
          explode: false
          in: query
          name: stages
          schema:
            description: Comma-separated list of stages, e.g. "accepted,rejected"; an application matches any of them
            type: string
        - description: JSON array of answer filters, e.g. [{"question_id":"…","question_type":"checkbox","values":["Yes"]}]. Values may be a string or an array of strings; a filter matches any of them, and separate filters are AND'd.
          explode: false
          in: query
          name: answer_filters
          schema:
            description: JSON array of answer filters, e.g. [{"question_id":"…","question_type":"checkbox","values":["Yes"]}]. Values may be a string or an array of strings; a filter matches any of them, and separate filters are AND'd.
            type: string
        - description: Comma-separated list of interview ratings, e.g. "must_hire,great"
          explode: false
          in: query
          name: rating_filters
          schema:
            description: Comma-separated list of interview ratings, e.g. "must_hire,great"
            type: string
        - description: Case-insensitive substring match on the applicant's name, NUID, or email
          explode: false
          in: query
          name: search
          schema:
            description: Case-insensitive substring match on the applicant's name, NUID, or email
            type: string
        - description: Max results per page; omit (or 0) to return every match
          explode: false
          in: query
          name: limit
          schema:
            description: Max results per page; omit (or 0) to return every match
            format: int64
            maximum: 200
            minimum: 0
            type: integer
        - description: Number of results to skip
          explode: false
          in: query
          name: offset
          schema:
            description: Number of results to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List applications
      tags:
        - Applications
    post:
      description: One application per applicant, role, and cycle.
      operationId: create-application
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: Created
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Submit an application
      tags:
        - Applications
  /applications/{id}:
    delete:
      description: Applicant only, and only while still a draft.
      operationId: delete-application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Discard a draft application
      tags:
        - Applications
    get:
      operationId: get-application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get an application
      tags:
        - Applications
    patch:
      description: Set resume_url, availability, or advance/withdraw the stage.
      operationId: update-application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Update an application
      tags:
        - Applications
  /applications/{id}/answers:
    get:
      operationId: list-answers
      parameters:
        - description: Application ID
          in: path
          name: id
          required: true
          schema:
            description: Application ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WrittenAnswer"
                type:
                  - array
                  - "null"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List an application's written answers
      tags:
        - Answers
    put:
      description: Bulk upsert keyed on (application, question). Owner-only, and only while the application is still a draft.
      operationId: upsert-answers
      parameters:
        - description: Application ID
          in: path
          name: id
          required: true
          schema:
            description: Application ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAnswersInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WrittenAnswer"
                type:
                  - array
                  - "null"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Submit or update written answers
      tags:
        - Answers
  /applications/{id}/answers/{questionId}/file-url:
    get:
      operationId: create-answer-file-url
      parameters:
        - description: Application ID
          in: path
          name: id
          required: true
