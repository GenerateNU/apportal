info:
  description: |-
    Generate application portal — applications, reviews, and the hiring workflow.

    A write the workflow flags as an override or destructive answers 409 with an error at `query.confirm_override`; chiefs and admins repeat it with `?confirm_override=true` to go ahead, and it is recorded.
  title: apportal API
  version: 0.1.0
openapi: 3.1.0
paths:
  /answers:
    get:
      description: One request for a page of applications, instead of one per application. Reviewer-only; draft answers are never included.
      operationId: list-answers-bulk
      parameters:
        - description: Comma-separated application IDs
          explode: false
          in: query
          name: application_ids
          schema:
            description: Comma-separated application IDs
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WrittenAnswer"
                type:
                  - array
                  - "null"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List written answers for several applications
      tags:
        - Answers
  /applicants:
    post:
      description: Applicant-facing; upserts by NUID.
      operationId: upsert-applicant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertApplicantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
          description: OK
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create or update an applicant
      tags:
        - Applicants
  /applicants/{nuid}:
    get:
      operationId: get-applicant
      parameters:
        - in: path
          name: nuid
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get an applicant
      tags:
        - Applicants
  /applicants/{nuid}/challenge-score:
    get:
      description: Reviewer only. Reads the applicant's best finished expedition from the separate challenge server, matched by their apportal email. Body is null if they have none there (e.g. they took the frontend challenge, or the lookup isn't configured).
      operationId: get-challenge-score
      parameters:
        - in: path
          name: nuid
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeScore"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get an applicant's technical challenge score
      tags:
        - Applicants
  /application-templates/open:
    get:
      description: A row is included only when both its own status and its owning cycle's status are "open".
      operationId: list-open-application-templates
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ApplicationTemplate"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List application templates currently open to applicants
      tags:
        - Application Templates
  /applications:
    get:
      description: Reviewer queue; filter by cycle_id, role/roles, stage, answer_filters, and rating_filters. Applicants may list their own by passing user_nuid.
      operationId: list-applications
      parameters:
        - explode: false
          in: query
          name: cycle_id
          schema:
            type: string
        - explode: false
          in: query
          name: user_nuid
          schema:
            type: string
        - description: Limit to applications this lead is assigned to review
          explode: false
          in: query
          name: assigned_to
          schema:
            description: Limit to applications this lead is assigned to review
            type: string
        - description: Limit to applications this reviewer is assigned to interview
          explode: false
          in: query
          name: interviewer_nuid
          schema:
            description: Limit to applications this reviewer is assigned to interview
            type: string
        - description: Limit to applications this lead is assigned to review the interview recording of
          explode: false
          in: query
          name: recording_reviewer_nuid
          schema:
            description: Limit to applications this lead is assigned to review the interview recording of
            type: string
        - explode: false
          in: query
          name: role_id
          schema:
            type: string
        - description: Comma-separated list of applicant role IDs; an application matches any of them
          explode: false
          in: query
          name: role_ids
          schema:
            description: Comma-separated list of applicant role IDs; an application matches any of them
            type: string
        - explode: false
          in: query
          name: stage
          schema:
            type: string
        - description: Comma-separated list of stages, e.g. "accepted,rejected"; an application matches any of them
          explode: false
          in: query
          name: stages
          schema:
            description: Comma-separated list of stages, e.g. "accepted,rejected"; an application matches any of them
            type: string
        - description: JSON array of answer filters, e.g. [{"question_id":"…","question_type":"checkbox","values":["Yes"]}]. Use question_ids for a question authored once per applicant role. Values may be a string or an array of strings; a filter matches any of them, and separate filters are AND'd.
          explode: false
          in: query
          name: answer_filters
          schema:
            description: JSON array of answer filters, e.g. [{"question_id":"…","question_type":"checkbox","values":["Yes"]}]. Use question_ids for a question authored once per applicant role. Values may be a string or an array of strings; a filter matches any of them, and separate filters are AND'd.
            type: string
        - description: Comma-separated list of interview ratings, e.g. "must_hire,great"
          explode: false
          in: query
