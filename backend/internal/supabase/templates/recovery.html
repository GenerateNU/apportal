<h2>Reset your Generate password</h2>

<p>
  Click the link below to choose a new password. It expires in one hour and can
  only be used once.
</p>

<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
    >Set a new password</a
  >
</p>

<p>If you didn't request this, you can ignore this email.</p>
